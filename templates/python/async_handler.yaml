# 异步处理器模板 v2
id: async-handler-v2
name: Async Handler
description: 异步请求处理器，带超时控制、重试机制和错误处理
language: python
tags:
  - async
  - handler
  - http
  - error-handling

parameters:
  - name: handler_name
    type: string
    required: true
    description: 处理函数名称
  - name: input_type
    type: string
    default: "Request"
    description: 输入类型
  - name: output_type
    type: string
    default: "Response"
    description: 输出类型
  - name: timeout_seconds
    type: int
    default: 30
    description: 超时时间（秒）
  - name: retry_count
    type: int
    default: 3
    description: 重试次数
  - name: retry_delay
    type: float
    default: 1.0
    description: 重试间隔（秒）
  - name: log_level
    type: string
    default: "INFO"
    options:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    description: 日志级别

metadata:
  author: AgentHub
  version: "2.0.0"
  tags:
    - async
    - handler
    - production-ready
  examples:
    - parameters:
        handler_name: "process_payment"
        input_type: "PaymentRequest"
        timeout_seconds: 60
      description: 支付处理异步接口

template: |
  async def {{ handler_name }}(request: {{ input_type }}) -> {{ output_type }}:
      """
      {{ handler_name }} - 异步请求处理器

      特性:
      - 超时控制: {{ timeout_seconds }}秒
      - 自动重试: {{ retry_count }}次
      - 指数退避: 基础间隔 {{ retry_delay }}秒
      """
      import asyncio
      import logging

      logger = logging.getLogger(__name__)
      logger.setLevel(logging.{{ log_level }})

      async with asyncio.timeout({{ timeout_seconds }}):
          for attempt in range({{ retry_count }}):
              try:
                  logger.info(f"{{ handler_name }}: attempt {attempt + 1}/{% raw %}{{% endraw %}{{ retry_count }}}")

                  # === 业务逻辑区域 ===
                  result = await _{{ handler_name }}_impl(request)
                  # ====================

                  logger.info(f"{{ handler_name }}: success")
                  return {{ output_type }}(success=True, data=result)

              except asyncio.TimeoutError:
                  logger.warning(f"{{ handler_name }}: timeout on attempt {attempt + 1}")
                  if attempt == {{ retry_count }} - 1:
                      return {{ output_type }}(success=False, error="Operation timed out")
                  await asyncio.sleep({{ retry_delay }} * (2 ** attempt))

              except Exception as e:
                  logger.error(f"{{ handler_name }}: error - {e}")
                  if attempt == {{ retry_count }} - 1:
                      return {{ output_type }}(success=False, error=str(e))
                  await asyncio.sleep({{ retry_delay }} * (2 ** attempt))

      return {{ output_type }}(success=False, error="Max retries exceeded")


  async def _{{ handler_name }}_impl(request: {{ input_type }}):
      """实际业务逻辑实现"""
      # TODO: 在此实现具体业务逻辑
      raise NotImplementedError("业务逻辑待实现")
