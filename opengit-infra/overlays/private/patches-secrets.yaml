# 覆盖 base 中的 Secret，填入真实值
# 注意：不要把这个文件提交到公开 git 仓库
# 推荐：用 sealed-secrets 或 sops 加密后再提交
- op: replace
  path: /stringData/DATABASE_URL
  value: postgresql+psycopg2://opengit:CHANGE_DB_PASSWORD@postgres:5432/opengit
- op: replace
  path: /stringData/JWT_SECRET
  value: CHANGE_TO_STRONG_RANDOM_64_CHARS
- op: replace
  path: /stringData/JWT_SECRET_KEY
  value: CHANGE_TO_STRONG_RANDOM_64_CHARS
- op: replace
  path: /stringData/WECHAT_TOKEN
  value: CHANGE_OR_REMOVE_IF_NOT_USING_WECHAT
- op: replace
  path: /stringData/INTERNAL_API_TOKEN
  value: CHANGE_TO_STRONG_RANDOM_TOKEN
# 私有部署不需要 GitHub OAuth，设为空占位
- op: replace
  path: /stringData/ZHIPUAI_API_KEY
  value: ""
- op: replace
  path: /stringData/EXTERNAL_CI_SECRET
  value: ""
