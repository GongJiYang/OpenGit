apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/opengit-dev/opengit-api-gateway:REPLACED_BY_KUSTOMIZE
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          env:
            - name: PYTHONPATH
              value: "/app:/app/apps/api-gateway:/app/apps/api-gateway/src:/app/packages/protocol/src:/app/services/git-core/src:/app/services/semantic-store/src:/app/services/execution-vmm/src"
          volumeMounts:
            - name: agenthub-data
              mountPath: /app/apps/api-gateway/agenthub_data
      volumes:
        - name: agenthub-data
          persistentVolumeClaim:
            claimName: agenthub-data
