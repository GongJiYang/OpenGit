name: GitOps Required Secrets Guard

on:
  pull_request:
    paths:
      - 'deploy/k8s/api-gateway/secret.yaml'
      - 'opengit-infra/base/api-gateway/secret.yaml'
      - '.github/workflows/gitops-guard-required-secrets.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/k8s/api-gateway/secret.yaml'
      - 'opengit-infra/base/api-gateway/secret.yaml'
      - '.github/workflows/gitops-guard-required-secrets.yml'

jobs:
  required-secret-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required keys in api-gateway secrets
        run: |
          set -euo pipefail

          FILES=(
            "deploy/k8s/api-gateway/secret.yaml"
            "opengit-infra/base/api-gateway/secret.yaml"
          )

          REQUIRED_KEYS=(
            "DATABASE_URL"
            "ZHIPUAI_API_KEY"
            "EXTERNAL_CI_SECRET"
            "JWT_SECRET"
            "JWT_SECRET_KEY"
            "WECHAT_TOKEN"
            "GITHUB_CLIENT_ID"
            "GITHUB_CLIENT_SECRET"
            "INTERNAL_API_TOKEN"
          )

          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing secret manifest: $f"
              exit 1
            fi

            for key in "${REQUIRED_KEYS[@]}"; do
              if ! grep -Eq "^[[:space:]]+${key}:" "$f"; then
                echo "Missing required key '${key}' in $f"
                exit 1
              fi
            done
          done
