name: Build Images & Update GitOps Repo

on:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: opengit-dev
  INFRA_REPO: GongJiYang/opengit-infra

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build & push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-api-gateway:${{ github.sha }}.${{ github.run_number }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-api-gateway:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push observer-ui
        uses: docker/build-push-action@v5
        with:
          context: apps/observer-ui
          file: apps/observer-ui/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-observer-ui:${{ github.sha }}.${{ github.run_number }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-observer-ui:prod
          build-args: |
            NEXT_PUBLIC_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update GitOps repo (dev)
        env:
          GITOPS_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO secret is not set (e.g., your-org/opengit-infra)"
            exit 1
          fi
          IMAGE_TAG="${GITHUB_SHA}.${{ github.run_number }}"
          git clone https://$GITOPS_TOKEN@github.com/$INFRA_REPO.git gitops
          cd gitops/overlays/dev
          kustomize edit set image ghcr.io/opengit-dev/opengit-api-gateway=ghcr.io/opengit-dev/opengit-api-gateway:$IMAGE_TAG
          kustomize edit set image ghcr.io/opengit-dev/opengit-observer-ui=ghcr.io/opengit-dev/opengit-observer-ui:$IMAGE_TAG
          cd ../..
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git commit -m "deploy: ${GITHUB_SHA}.${{ github.run_number }}" || exit 0
          git push

      - name: Sync GitOps repo (jobs/config)
        env:
          GITOPS_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          # Ensure gitops clone from previous step exists
          if [ ! -d gitops ]; then
            git clone https://$GITOPS_TOKEN@github.com/$INFRA_REPO.git gitops
          fi
          # Sync Job manifests and ConfigMap from app repo to infra repo.
          # Secrets stay managed in the GitOps repo so placeholder values here never overwrite live credentials.
          cp -f opengit-infra/overlays/dev/job-migrate.yaml gitops/overlays/dev/job-migrate.yaml || true
          cp -f opengit-infra/overlays/staging/job-migrate.yaml gitops/overlays/staging/job-migrate.yaml || true
          cp -f opengit-infra/overlays/prod/job-migrate.yaml gitops/overlays/prod/job-migrate.yaml || true
          cp -f opengit-infra/base/api-gateway/configmap.yaml gitops/base/api-gateway/configmap.yaml || true
          cd gitops
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add overlays/dev/job-migrate.yaml overlays/staging/job-migrate.yaml overlays/prod/job-migrate.yaml base/api-gateway/configmap.yaml
          git commit -m "infra: sync job-migrate + configmap from app repo" || exit 0
          git push

      - name: Update GitOps repo (staging)
        env:
          GITOPS_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO secret is not set (e.g., your-org/opengit-infra)"
            exit 1
          fi
          IMAGE_TAG="${GITHUB_SHA}.${{ github.run_number }}"
          cd gitops/overlays/staging
          kustomize edit set image ghcr.io/opengit-dev/opengit-api-gateway=ghcr.io/opengit-dev/opengit-api-gateway:$IMAGE_TAG
          kustomize edit set image ghcr.io/opengit-dev/opengit-observer-ui=ghcr.io/opengit-dev/opengit-observer-ui:$IMAGE_TAG
          cd ../..
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add overlays/staging/kustomization.yaml
          git commit -m "deploy: ${GITHUB_SHA}.${{ github.run_number }} (staging)" || exit 0
          git push

      - name: Update GitOps repo (prod)
        env:
          GITOPS_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO secret is not set (e.g., your-org/opengit-infra)"
            exit 1
          fi
          IMAGE_TAG="${GITHUB_SHA}.${{ github.run_number }}"
          cd gitops/overlays/prod
          kustomize edit set image ghcr.io/opengit-dev/opengit-api-gateway=ghcr.io/opengit-dev/opengit-api-gateway:$IMAGE_TAG
          kustomize edit set image ghcr.io/opengit-dev/opengit-observer-ui=ghcr.io/opengit-dev/opengit-observer-ui:$IMAGE_TAG
          cd ../..
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add overlays/prod/kustomization.yaml
          git commit -m "deploy: ${GITHUB_SHA}.${{ github.run_number }} (prod)" || exit 0
          git push
