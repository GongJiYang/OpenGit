name: Build Images & Update GitOps Repo

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: opengit-dev
  INFRA_REPO: GongJiYang/opengit-infra

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build & push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-api-gateway:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-api-gateway:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push observer-ui
        uses: docker/build-push-action@v5
        with:
          context: apps/observer-ui
          file: apps/observer-ui/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-observer-ui:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/opengit-observer-ui:prod
          build-args: |
            NEXT_PUBLIC_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update GitOps repo (dev)
        env:
          GITOPS_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO secret is not set (e.g., your-org/opengit-infra)"
            exit 1
          fi
          git clone https://$GITOPS_TOKEN@github.com/$INFRA_REPO.git gitops
          cd gitops
          kustomize edit set image ghcr.io/opengit-dev/opengit-api-gateway=ghcr.io/opengit-dev/opengit-api-gateway:${GITHUB_SHA} -- overlays/dev
          kustomize edit set image ghcr.io/opengit-dev/opengit-observer-ui=ghcr.io/opengit-dev/opengit-observer-ui:${GITHUB_SHA} -- overlays/dev
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git commit -m "deploy: ${GITHUB_SHA}" || exit 0
          git push

      - name: Update GitOps repo (prod)
        env:
          GITOPS_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          if [ -z "$INFRA_REPO" ]; then
            echo "INFRA_REPO secret is not set (e.g., your-org/opengit-infra)"
            exit 1
          fi
          cd gitops
          kustomize edit set image ghcr.io/opengit-dev/opengit-api-gateway=ghcr.io/opengit-dev/opengit-api-gateway:${GITHUB_SHA} -- overlays/prod
          kustomize edit set image ghcr.io/opengit-dev/opengit-observer-ui=ghcr.io/opengit-dev/opengit-observer-ui:${GITHUB_SHA} -- overlays/prod
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add overlays/prod/kustomization.yaml
          git commit -m "deploy: ${GITHUB_SHA} (prod)" || exit 0
          git push
