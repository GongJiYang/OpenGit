version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=agenthub
      - POSTGRES_PASSWORD=agenthub
      - POSTGRES_DB=agenthub
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Frontend ---
  observer-ui:
    build:
      context: ../apps/observer-ui
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production

  # --- Gateway ---
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - observer-ui
      - api-gateway
      - postgres

  # --- Gateway / Monolith ---
  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://agenthub:agenthub@postgres:5432/agenthub
      - AUTH_DATABASE_URL=postgresql+psycopg2://agenthub:agenthub@postgres:5432/agenthub
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - QDRANT_URL=${QDRANT_URL:-:memory:}
    volumes:
      # Persist Repos and Vectors
      - ./agenthub_data:/app/apps/api-gateway/agenthub_data
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    driver: bridge
