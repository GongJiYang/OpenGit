events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream observer_ui  { server observer-ui:3000; }
    upstream api_gateway  { server api-gateway:8000; }

    server {
        listen 80;
        # 私有部署：不需要域名，直接 IP 访问
        # 如需 HTTPS，在此加 ssl 配置或在前面放 Traefik/Caddy

        client_max_body_size 20m;

        # 前端
        location / {
            proxy_pass http://observer_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API v1 路由
        location /api/v1/ {
            proxy_pass         http://api_gateway;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # 所有其他 /api/* 路由（去掉 /api 前缀转发到后端）
        # 覆盖 /api/bounties, /api/stats, /api/repos, /api/search 等
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://api_gateway;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # Agent 文档
        location ~ ^/(agent|skill|heartbeat|rules)\.md$ {
            proxy_pass http://api_gateway;
        }
    }
}
