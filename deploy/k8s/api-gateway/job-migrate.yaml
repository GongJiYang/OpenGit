apiVersion: batch/v1
kind: Job
metadata:
  name: api-gateway-migrate
  namespace: default
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: your-registry/agenthub-api-gateway:TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: DATABASE_URL
            - name: ALEMBIC_CONFIG
              value: /app/apps/api-gateway/alembic.ini
          command: ["sh","-c"]
          args:
            - |
              if [ -f "$ALEMBIC_CONFIG" ]; then
                alembic -c "$ALEMBIC_CONFIG" upgrade head
              else
                echo "ALEMBIC_CONFIG not found at $ALEMBIC_CONFIG"; exit 1
              fi
