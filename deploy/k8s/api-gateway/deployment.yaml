apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api
          image: your-registry/agenthub-api-gateway:TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: DATABASE_URL
            - name: APP_ENABLE_INDEXER
              value: "0"
            - name: APP_ENABLE_SANDBOX
              value: "0"
            - name: RUN_SCHEDULER
              value: "0"
            - name: UVICORN_WORKERS
              value: "2"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /routes
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
