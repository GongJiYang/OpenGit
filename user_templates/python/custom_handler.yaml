# 用户自定义模板示例
# 这是一个示例模板，展示用户如何创建自己的模板
# 用户模板会覆盖同名平台模板（优先级更高）

id: custom-async-handler
name: Custom Async Handler
description: 用户自定义的异步处理器模板（可覆盖平台版本）
language: python
tags:
  - async
  - handler
  - custom
  - user-template

parameters:
  - name: handler_name
    type: string
    required: true
    description: 处理函数名称
  - name: include_logging
    type: bool
    default: true
    description: 是否包含日志
  - name: include_metrics
    type: bool
    default: false
    description: 是否包含性能指标

metadata:
  author: "User"
  version: "1.0.0"
  tags:
    - custom
  examples:
    - parameters:
        handler_name: "process_order"
        include_logging: true
        include_metrics: true
      description: 订单处理接口

template: |
  {% if include_logging %}
  import logging
  logger = logging.getLogger(__name__)
  {% endif %}

  {% if include_metrics %}
  import time
  from functools import wraps

  def track_metrics(func):
      @wraps(func)
      async def wrapper(*args, **kwargs):
          start = time.perf_counter()
          try:
              result = await func(*args, **kwargs)
              duration = time.perf_counter() - start
              logger.info(f"{func.__name__} completed in {duration:.3f}s")
              return result
          except Exception as e:
              duration = time.perf_counter() - start
              logger.error(f"{func.__name__} failed after {duration:.3f}s: {e}")
              raise
      return wrapper
  {% endif %}

  {% if include_metrics %}
  @track_metrics
  {% endif %}
  async def {{ handler_name }}(request):
      """
      {{ handler_name }} - 用户自定义异步处理器
      """
      {% if include_logging %}
      logger.info(f"{{ handler_name }} called with request: {request}")
      {% endif %}

      try:
          # TODO: 实现业务逻辑
          result = await _{{ handler_name }}_impl(request)

          {% if include_logging %}
          logger.info(f"{{ handler_name }} completed successfully")
          {% endif %}

          return {"success": True, "data": result}

      except Exception as e:
          {% if include_logging %}
          logger.error(f"{{ handler_name }} failed: {e}")
          {% endif %}
          return {"success": False, "error": str(e)}


  async def _{{ handler_name }}_impl(request):
      """实际业务逻辑"""
      # TODO: 在此实现具体业务逻辑
      raise NotImplementedError("业务逻辑待实现")
